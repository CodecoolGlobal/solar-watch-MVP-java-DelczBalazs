spring.application.name=solar-watch

# Server
server.port=8080

# External APIs
solarwatch.openweather.base-url=https://api.openweathermap.org
solarwatch.openweather.api-key=${OPENWEATHER_API_KEY:changeme}
solarwatch.sunrise.base-url=https://api.sunrise-sunset.org

# Logging
logging.level.root=INFO
logging.level.hu.yourname.solarwatch=INFO

# --- PostgreSQL ---
# Default: localhost (for mvn spring-boot:run)
# Override in Docker with -e DB_URL=jdbc:postgresql://host.docker.internal:5432/solarwatch
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/solarwatch}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:secret}

# Store/return timestamps in UTC at the JDBC/Hibernate level
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Schema management
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
