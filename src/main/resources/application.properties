spring.application.name=solar-watch

# Server
server.port=8080

# External APIs
solarwatch.openweather.base-url=https://api.openweathermap.org
solarwatch.openweather.api-key=${OPENWEATHER_API_KEY}
solarwatch.sunrise.base-url=https://api.sunrise-sunset.org

# Logging
logging.level.root=INFO
logging.level.hu.yourname.solarwatch=INFO

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/solarwatch
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Store/return timestamps in UTC at the JDBC/Hibernate level
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Schema management
# SCHOOL: quick iterations (ok for bootcamp)
spring.jpa.hibernate.ddl-auto=update
# PRO: use Flyway/Liquibase + ddl-auto=validate (later)
# spring.jpa.hibernate.ddl-auto=validate