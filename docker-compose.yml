services:
  db:
    image: postgres:16-alpine
    container_name: solarwatch-db
    environment:
      POSTGRES_DB: solarwatch
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d solarwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  solarwatch-backend:
    build: ./solarwatch-backend
    image: solarwatch-backend
    container_name: solarwatch-backend
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DB_URL: jdbc:postgresql://db:5432/solarwatch
      APP_JWT_SECRET: ${APP_JWT_SECRET}

  solarwatch-ai-service:
    build: ./solarwatch-ai-service
    image: solarwatch-ai-service
    container_name: solarwatch-ai-service
    expose:
      - "8082"
    environment:
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-4o-mini}

  solarwatch-frontend:
    working_dir: /app
    image: node:20-alpine
    container_name: solarwatch-frontend
    restart: unless-stopped
    volumes:
      - ./solarwatch-frontend:/app
    environment:
      VITE_DEV_PROXY_API: http://solarwatch-backend:8080
      VITE_DEV_PROXY_AI: http://solarwatch-ai-service:8082
      VITE_GOOGLE_MAPS_EMBED_KEY: ${VITE_GOOGLE_MAPS_EMBED_KEY}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    depends_on:
      - solarwatch-backend
      - solarwatch-ai-service

  nginx:
    image: nginx:alpine
    container_name: solarwatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      solarwatch-frontend:
        condition: service_healthy
      solarwatch-backend:
        condition: service_started
      solarwatch-ai-service:
        condition: service_started

volumes:
  pgdata:
