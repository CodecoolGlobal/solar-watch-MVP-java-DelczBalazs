server {
  listen 80;
  server_name _;

  # Proxy root to Vite dev server inside the compose network
  location / {
    proxy_pass http://solarwatch-frontend:5173/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Backend API
  location /api/ {
    proxy_pass http://solarwatch-backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # AI microservice API
  location /api/ai/ {
    proxy_pass http://solarwatch-ai-service:8082/api/ai/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Optional compression
  gzip on;
  gzip_types text/plain application/json text/css application/javascript;
}
